name: Build Ayran Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Ayran Launcher
        run: |
          mkdir source
          unzip -q AyranLauncher_Original_Ozgun_Arm64.zip -d source
          echo "Project files:"
          find source -maxdepth 2 -name gradlew -print

      - name: Build launcher
        run: |
          PROJECT_DIR=$(dirname "$(find source -name gradlew -type f | head -1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyranLauncher-APK
          path: source/**/app_pojavlauncher/build/outputs/apk/debug/*.apk
